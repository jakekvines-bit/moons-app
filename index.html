<style>
  :root{
    --bg:#0a0a16; --card:#12132a; --card2:#191a38; --border:#33356b; --text:#eafcff; --text2:#9aa8d0;
    --muted:#6d75a3; --accent:#00e5ff; --accent-bg:rgba(0,229,255,0.14); --danger:#ff3d68; --danger-bg:rgba(255,61,104,0.16);
    --warn-bg:rgba(255,212,0,0.16); --warn-text:#ffd400; --magenta:#ff2fb0; --font-pixel:'Press Start 2P',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  #app{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom)) 16px;min-height:100vh;}
  h1{font-size:15px;font-weight:700;margin:0 0 4px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text);}
  h1 .brand{font-family:var(--font-pixel);font-size:19px;color:var(--accent);text-shadow:2px 2px 0 var(--magenta);letter-spacing:1px;display:inline-block;line-height:1.7;}
  h2{font-size:14px;font-weight:700;margin:0 0 6px;text-transform:uppercase;letter-spacing:0.5px;}
  p{margin:0;}
  .muted{color:var(--muted);font-size:13px;}
  .text2{color:var(--text2);}
  .topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;padding-top:8px;}
  .card{background:var(--card);border:2px solid var(--border);border-radius:3px;padding:14px 16px;margin-bottom:12px;box-shadow:3px 3px 0 rgba(0,0,0,0.4);}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .badge{font-size:10px;font-weight:700;padding:4px 8px;border-radius:2px;background:var(--accent-bg);color:var(--accent);white-space:nowrap;border:1px solid var(--accent);text-transform:uppercase;letter-spacing:0.5px;}
  .badge.warn{background:var(--warn-bg);color:var(--warn-text);border-color:var(--warn-text);}
  button{font-family:inherit;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;border-radius:2px;border:2px solid var(--border);background:var(--card2);color:var(--text);padding:10px 14px;cursor:pointer;}
  button:active{transform:translate(2px,2px);}
  button.primary{background:var(--accent);color:#04101a;border-color:var(--accent);box-shadow:3px 3px 0 var(--magenta);}
  button.primary:active{box-shadow:1px 1px 0 var(--magenta);}
  button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px;box-shadow:none;}
  button.danger{color:var(--danger);border-color:var(--danger);}
  button:disabled{opacity:0.4;}
  input[type=number],input[type=text]{width:100%;font-size:15px;padding:8px;border-radius:2px;border:2px solid var(--border);background:var(--bg);color:var(--text);text-align:center;}
  label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.5px;}
  .exmeta{font-size:12px;color:var(--text2);margin-top:1px;}
  .divider{border-top:2px dashed var(--border);margin:10px 0;}
  .navbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10;-webkit-transform:translateZ(0);transform:translateZ(0);will-change:transform;}
  .navbtn{flex:1;text-align:center;padding:10px 0 8px;background:none;border:none;color:var(--muted);font-size:11px;font-weight:700;border-radius:0;text-transform:uppercase;letter-spacing:0.5px;}
  .navbtn.active{color:var(--accent);text-shadow:0 0 6px var(--accent);}
  .navicon{font-size:18px;display:block;margin-bottom:2px;}
  .timerbtn{width:100%;margin-top:6px;}
  .sparkwrap{margin-top:4px;}
  .stat{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--border);}
  .stat:last-child{border-bottom:none;}
  a.link{color:var(--accent);font-size:13px;font-weight:600;text-decoration:none;}
  .empty{text-align:center;padding:40px 16px;color:var(--muted);}
  .finishbar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;padding:0 16px;z-index:11;-webkit-transform:translateZ(0);transform:translateZ(0);will-change:transform;}
  .finishbar button{width:100%;padding:13px;font-size:14px;box-shadow:3px 3px 0 var(--magenta);}
  .settinggrid{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;padding:6px 0;}
  .tilegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px;}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 4px;border:2px solid var(--border);border-radius:3px;background:var(--card2);cursor:pointer;text-align:center;font-family:inherit;}
  .tile:active{transform:translate(2px,2px);}
  .tile.selected{border-color:var(--accent);background:var(--accent-bg);box-shadow:2px 2px 0 var(--accent);}
  .tileabbr{font-family:var(--font-pixel);font-size:11px;color:var(--muted);}
  .tile.selected .tileabbr{color:var(--accent);text-shadow:0 0 6px var(--accent);}
  .tilelabel{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.3px;line-height:1.3;}
  .tile.selected .tilelabel{color:var(--text);}
  textarea{width:100%;font-family:monospace;font-size:11px;height:80px;border-radius:2px;border:2px solid var(--border);background:var(--bg);color:var(--text);padding:8px;}

  /* ---- retro arcade decoration ---- */
  .arcadestrip{display:flex;justify-content:center;align-items:flex-end;gap:18px;margin:28px 0 6px;flex-wrap:wrap;}
  .arcadecaption{text-align:center;font-family:var(--font-pixel);font-size:10px;color:var(--magenta);letter-spacing:1px;margin-top:14px;animation:blink 1.4s steps(1) infinite;}
  @keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0.25;}}
  .celebrate-strip{position:relative;height:100px;overflow:hidden;margin-bottom:14px;}
  .celebrate-strip .walker{position:absolute;top:6px;left:-90px;animation:walkacross 3s linear 1;}
  @keyframes walkacross{from{left:-90px;}to{left:calc(100% + 90px);}}
  .checklist-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);opacity:0;animation:checkpop 0.3s ease forwards;}
  .checklist-item:last-child{border-bottom:none;}
  @keyframes checkpop{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
  .checkmark{flex:0 0 auto;width:22px;height:22px;border-radius:2px;background:var(--accent);color:#04101a;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:1px;}
  .spr-press{position:relative;width:72px;height:96px;flex:0 0 auto;}

var mem = {};

      return v ? JSON.parse(v) : fallback;
    }catch(e){
      return (key in mem) ? mem[key] : fallback;
    }
  },
  set: function(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }
    catch(e){ mem[key] = value; }
  }
};

/* ---------------- permanent device link (avoids repeated sign-ins) ----------------
   Each device gets one long-lived token stored in Supabase. Once saved to the
   home screen as the app's URL, opening the app exchanges that token for a
   real session automatically -- no email, no click-through, no typing. */
var pendingDeviceLink = null;

function deviceLinkParamToken(){
  try{
    var u = new URL(window.location.href);
    return u.searchParams.get("key");
  }catch(e){ return null; }
}

function redeemDeviceLink(token){
  return fetch("/.netlify/functions/redeem-token", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token: token })
  }).then(function(r){ return r.json(); }).then(function(data){
    if(data && data.token_hash){
      return supabaseClient.auth.verifyOtp({ token_hash: data.token_hash, type: "magiclink" }).then(function(res){
        if(res.error) throw res.error;
        try{ history.replaceState(null, "", window.location.pathname); }catch(e){}
        return res;
      });
    }
    throw new Error((data && data.error) || "Could not sign in with this link.");
  });
}

function mintDeviceLinkIfNeeded(user){
  /* Defensive on purpose: this runs on every successful load, so a hiccup here
     (missing table, offline, older client) should never block the actual app. */
  try{
    if(storage.get("hg_device_token_v1", null)) return;
    if(!user || !supabaseClient || typeof supabaseClient.from !== "function") return;
    var q = supabaseClient.from("device_tokens");
    if(!q || typeof q.insert !== "function") return;
    var token = (window.crypto && window.crypto.randomUUID)
      ? window.crypto.randomUUID()
      : (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2));
    q.insert({ token: token, user_id: user.id }).then(function(res){
      if(res && res.error){ console.error("Could not save permanent link:", res.error.message); return; }
      storage.set("hg_device_token_v1", token);
      var origin = (window.location && window.location.origin) || "";
      var pathname = (window.location && window.location.pathname) || "/";
      pendingDeviceLink = origin + pathname + "?key=" + token;
      render();
    }, function(err){
      console.error("Could not save permanent link:", err && err.message);
    });
  }catch(e){
    console.error("Could not set up permanent link:", e && e.message);
  }
}

  if(typeof state.profile.name !== "string") state.profile.name = "";

  /* anyone with pre-existing saved data predates onboarding -- don't force them through it */
  if(typeof state.onboarded !== "boolean") state.onboarded = true;
  if(typeof state.onboardStep !== "number") state.onboardStep = 0;
  if(!state.view) state.view = "today";

/* ---------------- profile-driven exercise safety engine ---------------- */
function blockedTagsForProfile(profile){
  var tags = [];
  if(profile.ailments.hipImpingement) tags.push("hipFlexionDepth");
  if(profile.ailments.discBulge) tags.push("heavyAxialSpineLoad","spinalFlexionLoaded","rotationLoaded");
  if(profile.ailments.shoulderImpingement) tags.push("overheadPressing");
  if(profile.ailments.kneeIssues) tags.push("deepKneeFlexion");
  return tags;
}
function isBlocked(ex, profile){
  if(!ex) return true;
  var blocked = blockedTagsForProfile(profile);
  var riskTags = ex.risk || [];
  var tagBlocked = riskTags.some(function(t){ return blocked.indexOf(t) >= 0; });
  var equipList = ex.equip || [];
  var equipBlocked = equipList.some(function(e){ return profile.equipment[e]===false; });
  return tagBlocked || equipBlocked;
}
function candidatesFor(pattern, role){
  return Object.keys(EX).filter(function(id){ return EX[id].pattern===pattern && (role==null || EX[id].role===role); });
}
function rankByTier(ids){
  return ids.slice().sort(function(a,b){ return (EX[a].tier||9)-(EX[b].tier||9); });
}
/* Layered fallback: exact pattern+role (unused) -> exact pattern+role (any) ->
   relax role within pattern (unused) -> relax role within pattern (any) ->
   ignore safety filtering entirely for the pattern -> absolute last resort, anything in the library.
   This guarantees a pick always exists, even for a zero-equipment, every-ailment-checked profile. */
function pickForSlot(pattern, role, profile, usedIds){
  usedIds = usedIds || [];
  function safeUnused(ids){ return ids.filter(function(id){ return !isBlocked(EX[id],profile) && usedIds.indexOf(id)<0; }); }
  function safeOnly(ids){ return ids.filter(function(id){ return !isBlocked(EX[id],profile); }); }
  var exactRole = candidatesFor(pattern, role);
  var anyRole = candidatesFor(pattern, null);
  var pools = [safeUnused(exactRole), safeOnly(exactRole), safeUnused(anyRole), safeOnly(anyRole), anyRole];
  for(var i=0;i<pools.length;i++){
    var ranked = rankByTier(pools[i]);
    if(ranked.length) return ranked[0];
  }
  return rankByTier(Object.keys(EX))[0];
}

function pickConditioning(condKey, profile){
  var prefs = CONDITIONING_PREFS[condKey] || CONDITIONING_PREFS.D;
  var blocked = blockedTagsForProfile(profile);
  for(var i=0;i<prefs.length;i++){
    var c = CONDITIONING_POOL[prefs[i]];
    if(!c) continue;
    var equipOk = (c.equip||[]).every(function(e){ return profile.equipment[e]!==false; });
    var riskOk = !(c.risk||[]).some(function(t){ return blocked.indexOf(t)>=0; });
    if(equipOk && riskOk) return prefs[i];
  }
  return "bodyweightCircuit";
}

function conditioningDesc(condId, tier){
  var c = CONDITIONING_POOL[condId] || CONDITIONING_POOL.bodyweightCircuit;
  var t = (typeof tier==="number" && c.levels[tier]) ? tier : 1;
  return c.levels[t];
}

/* ---------------- adaptive conditioning difficulty ---------------- */
function rateConditioning(rating){
  var streak = state.conditioningStreak;
  var msg;
  if(rating==="right"){
    state.conditioningStreak = {direction:null, count:0};
    msg = "Got it — keeping the finisher where it is.";
  } else if(rating==="easy"){
    if(streak.direction==="easy") streak.count++; else streak = {direction:"easy", count:1};
    state.conditioningStreak = streak;
    if(streak.count>=3 && state.conditioningTier<2){
      state.conditioningTier++;
      state.conditioningStreak = {direction:null, count:0};
      msg = "Three in a row too easy — bumping the finisher up a notch for next time.";
    } else if(state.conditioningTier>=2){
      msg = "Noted — you're already at the hardest finisher tier.";
    } else {
      msg = "Noted. "+(3-streak.count)+" more \"too easy\" in a row and I'll bump it up.";
    }
  } else if(rating==="hard"){
    if(streak.direction==="hard") streak.count++; else streak = {direction:"hard", count:1};
    state.conditioningStreak = streak;
    if(streak.count>=2 && state.conditioningTier>0){
      state.conditioningTier--;
      state.conditioningStreak = {direction:null, count:0};
      msg = "Two in a row too hard — easing up the finisher for next time.";
    } else if(state.conditioningTier<=0){
      msg = "Noted — you're already at the easiest finisher tier.";
    } else {
      msg = "Noted. One more \"too hard\" in a row and I'll ease it up.";
    }
  }
  save();
  return msg;
}

/* ---------------- bonus day logic ---------------- */
function buildBonusDay(){
  var recent = state.history.slice(-6);
  var counts = {squat:0,hinge:0,upperPush:0,upperPull:0};
  recent.forEach(function(s){
    s.exercises.forEach(function(e){
      var ex = EX[e.exId];
      if(!ex) return;
      if(ex.pattern==="squat") counts.squat += e.sets.length;
      else if(ex.pattern==="hinge") counts.hinge += e.sets.length;
      else if(ex.pattern==="horizontalPushFlat" || ex.pattern==="horizontalPushIncline" || ex.pattern==="verticalPush") counts.upperPush += e.sets.length;
      else if(ex.pattern==="horizontalPull" || ex.pattern==="verticalPull") counts.upperPull += e.sets.length;
    });
  });
  var lower = counts.squat+counts.hinge, upper = counts.upperPush+counts.upperPull;
  var parts, label;
  if(recent.length===0){ parts=[{pattern:"squat",role:"accessory"},{pattern:"verticalPush",role:"main"},{pattern:"verticalPull",role:"accessory"}]; label="Bonus day — full-body weak points + mobility"; }
  else if(lower <= upper){ parts=[{pattern:"squat",role:"accessory"},{pattern:"hinge",role:"accessory"},{pattern:"hinge",role:"finisher"}]; label="Bonus day — lower body focus + mobility"; }
  else if(counts.upperPush <= counts.upperPull){ parts=[{pattern:"verticalPush",role:"main"},{pattern:"horizontalPushFlat",role:"accessory"},{pattern:"horizontalPushFlat",role:"finisher"}]; label="Bonus day — upper push focus + mobility"; }
  else { parts=[{pattern:"verticalPull",role:"accessory"},{pattern:"verticalPull",role:"finisher"},{pattern:"horizontalPull",role:"finisher"}]; label="Bonus day — upper pull focus + mobility"; }
  return {label:label, cond:"D", isBonus:true, slots:[
    {type:"single", pattern:parts[0].pattern, role:parts[0].role},
    {type:"superset", restBetween:15, restAfterRound:75, parts:[parts[1], parts[2]]}
  ]};
}

/* ---------------- session lifecycle ---------------- */
function buildSessionExercise(pattern, role, usedIds){
  var exId = pickForSlot(pattern, role, state.profile, usedIds);
  usedIds.push(exId);
  var ex = EX[exId], p = getProgress(exId);
  var sets = [];
  for(var i=0;i<ex.sets;i++) sets.push({reps:p.repTarget, weight:p.weight, done:false});
  return {exId:exId, targetWeight:p.weight, targetReps:p.repTarget, sets:sets};
}

function previewNames(tpl){
  var used = [];
  return tpl.slots.map(function(slot){
    if(slot.type==="superset"){
      return slot.parts.map(function(part){
        var id = pickForSlot(part.pattern, part.role, state.profile, used);
        used.push(id);
        return EX[id].name;
      }).join(" + ") + " (superset)";
    }
    var id = pickForSlot(slot.pattern, slot.role, state.profile, used);
    used.push(id);
    return EX[id].name;
  });
}

function flattenGroups(groups){
  var out = [];
  groups.forEach(function(g){
    if(g.type==="superset") g.items.forEach(function(it){ out.push(it); });
    else out.push(g.item);
  });
  return out;
}

function startSession(dayKey){
  if(state.current) return false; /* never clobber an in-progress session's unsaved logs */
  var tpl = dayKey==="D" ? buildBonusDay() : TEMPLATES[dayKey];
  var used = [];
  var groups = tpl.slots.map(function(slot){
    if(slot.type==="superset"){
      return {type:"superset", restBetween:slot.restBetween, restAfterRound:slot.restAfterRound, items: slot.parts.map(function(part){ return buildSessionExercise(part.pattern, part.role, used); })};
    }
    var item = buildSessionExercise(slot.pattern, slot.role, used);
    return {type:"single", rest: EX[item.exId].rest, item:item};
  });
  var condId = pickConditioning(tpl.cond, state.profile);
  state.current = {dayKey:dayKey, label:tpl.label, cond:tpl.cond, condId:condId, conditioningTierUsed:state.conditioningTier, conditioningRating:null, groups:groups, isBonus:!!tpl.isBonus, startedAt:Date.now()};
  save();
  return true;
}

function updateProgress(exId, loggedSets){
  var ex = EX[exId];
  var validSets = loggedSets.filter(function(s){ return s.reps>0; });
  if(validSets.length===0) return null;
  var p = getProgress(exId);
  var hitTop = validSets.every(function(s){ return s.reps >= ex.repHigh; });
  var hitLow = validSets.every(function(s){ return s.reps >= ex.repLow; });
  var note = "";
  if(!ex.hasWeight){
    if(hitTop){ p.repTarget = ex.repHigh; note = "Maxed the rep range — add resistance/difficulty next time."; }
    else if(hitLow){ p.repTarget = Math.min(p.repTarget+1, ex.repHigh); note="Reps up next time."; }
    else { p.repTarget = ex.repLow; note="Reset to bottom of rep range."; }
  } else {
    if(hitTop){ p.weight = p.weight + ex.increment; p.repTarget = ex.repLow; note="Weight up "+ex.increment+" lb next time."; }
    else if(hitLow){ p.repTarget = Math.min(p.repTarget+1, ex.repHigh); note="Same weight, aim for more reps."; }
    else { p.weight = Math.max(0, p.weight - ex.increment); p.repTarget = ex.repLow; note="Backed off "+ex.increment+" lb to rebuild."; }
  }
  return note;
}

function finishSession(){
  var cur = state.current;
  if(!cur) return null;
  var flat = flattenGroups(cur.groups);
  var summary = {exercises:[], totalVolume:0, totalSets:0};
  flat.forEach(function(e){
    var loggedSets = e.sets.filter(function(s){ return s.reps>0; });
    var vol = loggedSets.reduce(function(a,s){ return a + s.reps*(s.weight||0); },0);
    summary.totalVolume += vol;
    summary.totalSets += loggedSets.length;
    var note = updateProgress(e.exId, e.sets);
    summary.exercises.push({exId:e.exId, name:EX[e.exId].name, sets:loggedSets, note:note});
  });
  state.history.push({
    id: Date.now(),
    date: new Date().toISOString().slice(0,10),
    dayKey: cur.dayKey,
    label: cur.label,
    exercises: flat.map(function(e){ return {exId:e.exId, sets:e.sets.filter(function(s){return s.reps>0;})}; }),
    totalVolume: summary.totalVolume,
    totalSets: summary.totalSets
  });
  if(!cur.isBonus && ROTATION.indexOf(cur.dayKey)>=0){
    state.cycleCompleted[cur.dayKey] = true;
    if(ROTATION.every(function(k){ return state.cycleCompleted[k]; })){
      ROTATION.forEach(function(k){ state.cycleCompleted[k] = false; });
    }
  }
  state.current = null;
  save();
  return summary;
}

/* first not-yet-done day in the current cycle, in rotation order -- what "Today" defaults to */
function nextCycleDay(){
  for(var i=0;i<ROTATION.length;i++){ if(!state.cycleCompleted[ROTATION[i]]) return ROTATION[i]; }
  return ROTATION[0];
}

    });

    var finishWrap = document.createElement('div');
    finishWrap.className = 'finishbar';
    finishWrap.innerHTML = '<button class="primary" id="finishBtn">Finish session</button>';
    app.appendChild(finishWrap);
    document.getElementById('finishBtn').addEventListener('click', function(){
      var summary = finishSession();
      state.view = 'summary';
      state._lastSummary = summary;
      render();
    });

    var sfBtn = document.getElementById('sessionFeedbackBtn');
    if(sfBtn){
      sfBtn.addEventListener('click', function(){
        var ta = document.getElementById('sessionFeedbackText');
        var statusEl = document.getElementById('sessionFeedbackStatus');
        var msg = ta.value.trim();
        if(!msg){ statusEl.textContent = "Write something first."; return; }
        sfBtn.disabled = true;
        sfBtn.textContent = "Sending...";
        supabaseClient.from("feedback").insert({
          user_id: currentUser ? currentUser.id : null,
          email: currentUser ? currentUser.email : null,
          message: msg,
          day_key: state.current ? state.current.dayKey : null,
          day_label: state.current ? state.current.label : null
        }).then(function(res){
          sfBtn.disabled = false;
          sfBtn.textContent = "Send feedback for this workout";
          if(res.error){
            statusEl.textContent = "Couldn't send: " + res.error.message;
          } else {
            ta.value = "";
            statusEl.textContent = "Sent — thanks!";
          }
        });
      });
    }
  }
}

var CELEBRATE_SPRITES = ["spr-press","spr-pullup","spr-jumprope","spr-kettlebell"];

  html += '<div class="card"><div class="row"><span class="text2">Total volume</span><span class="exname">'+Math.round(s.totalVolume).toLocaleString()+' lb</span></div>';
  html += '<div class="row"><span class="text2">Sets completed</span><span class="exname">'+s.totalSets+'</span></div></div>';

  });

function sparkline(points, w, h){
  if(points.length<2) return '<p class="muted">Log a few more sessions to see a trend.</p>';
  var min = Math.min.apply(null, points), max = Math.max.apply(null, points);
  if(min===max){ min -= 5; max += 5; }
  var stepX = w/(points.length-1);
  var d = points.map(function(p,i){
    var x = i*stepX;
    var y = h - ((p-min)/(max-min))*h;
    return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><path d="'+d+'" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent)"/></svg>';
}

function renderHistory(){
  var html = '<div class="topbar"><h1>History</h1></div>';
  if(state.history.length===0){
    html += '<div class="empty">No sessions logged yet.<br>Finish a workout on the Today tab and it will show up here.</div>';
  } else {
    var seenIds = {};
    state.history.forEach(function(sess){
      sess.exercises.forEach(function(e){
        if(EX[e.exId] && EX[e.exId].hasWeight) seenIds[e.exId] = true;
      });
    });
    var mainLifts = Object.keys(seenIds);
    html += '<div class="card"><h2>Top-set weight trend</h2>';
    if(mainLifts.length===0) html += '<p class="muted">Log a couple more sessions to see weight trends here.</p>';
    mainLifts.forEach(function(exId){
      var points = [];
      state.history.forEach(function(sess){
        var found = sess.exercises.find(function(e){ return e.exId===exId; });
        if(found && found.sets.length){
          var top = Math.max.apply(null, found.sets.map(function(s){return s.weight||0;}));
          points.push(top);
        }
      });
      if(points.length===0) return;
      html += '<div class="sparkwrap"><div class="row"><span class="text2" style="font-size:13px;">'+EX[exId].name+'</span><span class="exmeta">'+points[points.length-1]+' lb</span></div>'+sparkline(points,260,36)+'</div>';
    });
    html += '</div>';

    html += '<h2 style="margin:16px 0 8px;">Sessions</h2>';
    state.history.slice().reverse().forEach(function(sess){
      html += '<div class="card"><div class="row"><span class="exname">'+sess.label+'</span><span class="muted">'+fmtDate(sess.date)+'</span></div>';
      html += '<p class="exmeta">'+sess.totalSets+' sets · '+Math.round(sess.totalVolume).toLocaleString()+' lb total volume</p></div>';
    });
  }
  html += navHtml();
  app.innerHTML = html;
  wireNav();
}

    html += '</button>';
  });
  html += '</div>';

function wireEquipmentGrid(afterToggle){
  app.querySelectorAll('[data-equip-tile]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-equip-tile');
      state.profile.equipment[id] = !state.profile.equipment[id];
      save();
      if(afterToggle) afterToggle(); else render();
    });
  });
}

function renderSettings(){
  var html = '<div class="topbar"><h1>Settings</h1></div>';

  html += '<div class="card"><h2>Your profile</h2><p class="muted" style="margin-bottom:8px;">Exercises that conflict with what you check below get automatically swapped for a safer alternative — the same logic works if a friend sets up their own profile.</p>';
  html += '<label>Name</label><input type="text" id="settingsName" value="'+(state.profile.name||'')+'" autocomplete="off" style="margin-bottom:10px;">';

  });

    var checked = state.profile.ailments[pair[0]] ? 'checked' : '';

  html += equipmentGridHtml(state.profile.equipment);
  html += '<div class="divider"></div><label>Notes (movements to avoid, anything else worth knowing)</label><textarea id="profileNotes" style="height:60px;">'+state.profile.notes+'</textarea>';
  html += '</div>';

  html += '<div class="card"><h2>Starting weights</h2><p class="muted" style="margin-bottom:8px;">Set your current working weight for each lift — the app progresses from here.</p>';
  Object.keys(EX).filter(function(id){ return EX[id].hasWeight; }).forEach(function(id){
    var p = getProgress(id);
    html += '<div class="settinggrid"><span style="font-size:14px;">'+EX[id].name+'</span><input type="number" data-weight-ex="'+id+'" value="'+p.weight+'"></div>';
  });
  html += '</div>';

  html += '<div class="card"><h2>Conditioning finisher difficulty</h2>';
  html += '<p class="muted" style="margin-bottom:8px;">Rate the finisher after a session (Too easy / Just right / Too hard) and this adjusts on its own — three "too easy" in a row bumps it up, two "too hard" in a row eases it off.</p>';
  html += '<div class="row"><span class="text2">Current level</span><span class="badge">'+CONDITIONING_TIER_LABELS[state.conditioningTier]+'</span></div>';
  html += '<button style="width:100%;margin-top:8px;" id="resetTierBtn">Reset to standard</button>';
  html += '</div>';

  html += '<input type="file" id="importFile" accept="application/json" style="display:none;">';
  html += '<button style="width:100%;margin-bottom:8px;" id="replayBtn">Replay setup wizard</button>';

  document.getElementById('profileNotes').addEventListener('change', function(e){

    save();
  });
  document.getElementById('settingsName').addEventListener('change', function(e){
    state.profile.name = e.target.value;
    save();
  });
  app.querySelectorAll('[data-goal]').forEach(function(inp){

      save();
    });

  app.querySelectorAll('[data-days]').forEach(function(btn){

    });

  document.getElementById('replayBtn').addEventListener('click', function(){
    state.onboarded = false;
    state.onboardStep = 0;
    save();
    render();
  });

  document.getElementById('exportBtn').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = "home-gym-backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('importBtn').addEventListener('click', function(){
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        state = data;
        normalizeState();
        save();
        render();
      }catch(err){ alert("That file could not be read as a valid backup."); }
    };
    reader.readAsText(file);
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    if(confirm("This clears all logged sessions and progress. This cannot be undone. Continue?")){
      state = freshState();
      state.onboarded = true;
      state.view = "settings";
      normalizeState();
      save();
      render();
    }
  });

  document.getElementById('resetTierBtn').addEventListener('click', function(){
    state.conditioningTier = 1;
    state.conditioningStreak = {direction:null, count:0};
    save();
    render();
  });

}

/* ---------------- auth + cloud load lifecycle ---------------- */
function loadUserState(user){
  return supabaseClient.from("user_data").select("state").eq("id", user.id).maybeSingle().then(function(res){
    if(res.error) throw res.error;
    var loaded = res.data && res.data.state;
    if(loaded && Object.keys(loaded).length){
      state = loaded;
    } else {
      /* brand new account -- if this browser has data from the old offline-only version, carry it over once */
      state = storage.get("hg_state_v1", null) || storage.get("hg_state_cache", null) || freshState();
    }
    normalizeState();
    save();
  }).catch(function(err){
    console.error("Could not load from server, using local cache:", err && err.message);
    state = storage.get("hg_state_cache", null) || storage.get("hg_state_v1", null) || freshState();
    normalizeState();
  }).then(function(){
    render();
    mintDeviceLinkIfNeeded(user);
  });
}

supabaseClient.auth.onAuthStateChange(function(event, session){
  if(session && session.user){
    if(!currentUser || currentUser.id !== session.user.id){
      currentUser = session.user;
      renderLoading();
      loadUserState(currentUser);
    }
  } else if(!session){
    currentUser = null;
    state = null;
    render();
  }
});

/* Ask the browser not to evict this site's storage under low-storage/inactivity cleanup --
   iOS Safari in particular can otherwise clear localStorage (including the sign-in session)
   for home-screen web apps after periods of non-use. This is a best-effort request; the browser
   may still say no, but it's free insurance against exactly the "signed out every time" symptom. */
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persist().catch(function(){});
}

supabaseClient.auth.getSession().then(function(res){
  var session = res.data && res.data.session;
  if(session && session.user){
    currentUser = session.user;
    renderLoading();
    loadUserState(currentUser);
  } else {
    var savedLinkToken = deviceLinkParamToken();
    if(savedLinkToken){
      renderLoading();
      redeemDeviceLink(savedLinkToken).catch(function(err){
        authMessage = "Your saved link stopped working (" + (err && err.message || "unknown error") + "). Please sign in again below.";
        render();
      });
      /* onAuthStateChange fires and picks up the new session on success */
    } else {
      render();
    }
  }
});
})();
</script>
